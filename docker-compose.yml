version: "3.9"

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - DATA_DIR=/data
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./data:/data

volumes:
  mongo_data:


